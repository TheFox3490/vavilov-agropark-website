# Внутренний nginx контейнера: отдаёт собранный React, проксирует /api на Flask
# и раздаёт загруженные картинки. Наружу торчит одним портом — внешний nginx
# на сервере проксирует на него и занимается доменом и TLS.

upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности. HSTS намеренно не ставим — TLS терминируется
    # внешним прокси, там ему и место.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Роботы ищут эти два файла в корне, а собираются они из базы:
    # карта сайта должна знать про каждую новость и каждый проект.
    location = /robots.txt {
        proxy_pass http://backend/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Картинки новостей лежат на общем томе с бэкендом — отдаём напрямую,
    # не гоняя их через Python.
    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаём index.html, маршрутизацией займётся
    # React Router. ssi on нужен, чтобы вклеить в <head> метатеги страницы,
    # собранные бэкендом, — роботам достаётся готовый HTML.
    location / {
        ssi on;
        try_files $uri $uri/ /index.html;
    }
}
